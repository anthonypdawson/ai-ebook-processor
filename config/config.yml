ollama:
  host: http://localhost:11434
  model: llama3.2:latest
  temperature: 0.7
output:
  create_report: true
  directory: output
processing:
  chunk_overlap: 200
  chunk_size: 4000
  output_format: markdown
  processing_mode: summary
  save_chunks: false
  summary_mode: classic   # classic | strict (strict enforces grounded citations)
  summary_max_chars: 12000
  summary_temperature: 0.15
  require_citations: true

  # Parallel processing configuration
  parallel:
    enabled: false
    book_workers: 3        # Number of books to process simultaneously
    chunk_workers: 4       # Parallel chunks within a single book
    embedding_batch_size: 32  # Batch size for embedding generation
    queue_timeout: 300     # Maximum seconds per book
    
  progress:
    enabled: true
    update_interval: 2     # Progress update frequency (seconds)  
    show_book_names: true  # Display current book being processed
    show_chunk_progress: true  # Show chunk-level progress
    show_embedding_progress: true  # Show embedding generation progress

logging:
  level: info
  verbose: false

# Feature flags for incremental rollout
features:
  parallel_processing: true
  hallucination_mitigation: false  # Enable after parallel working
  dual_embeddings: false           # Enable after hallucination complete

# RAG system configuration (for future use)
rag:
  persist_directory: "ebook_db"
  collection_name: "ebook_collection"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2" # Common models:
    # - sentence-transformers/all-MiniLM-L6-v2 (default, fast, small)
    # - sentence-transformers/all-mpnet-base-v2 (high accuracy, larger)
    # - sentence-transformers/paraphrase-MiniLM-L6-v2 (paraphrase focus)
    # - sentence-transformers/distiluse-base-multilingual-cased-v2 (multilingual)
    # - BAAI/bge-base-en-v1.5 (BGE, high accuracy)
    # - intfloat/e5-base-v2 (E5, retrieval focus)
    # - Where possible, use HuggingFace model names
  context_chunk_count: 10
  
  # Batch processing configuration
  batch_size_override: null  # Override automatic batch size calculation (null = auto-calculate)
  target_memory_mb: 100       # Target memory usage for batch processing
