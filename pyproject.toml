[tool.poetry]
name = "ai-ebook-processor"
version = "1.0.0"
description = "AI-powered ebook processing and analysis tool with RAG capabilities"
authors = ["Anthony Dawson <anthony@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "ai_ebook_processor"}]
keywords = [
    "ebook",
    "pdf", 
    "epub",
    "ai",
    "ollama",
    "rag",
    "retrieval-augmented-generation",
    "nlp",
    "text-processing",
    "semantic-search",
    "vector-database",
    "chromadb",
    "book-analysis",
    "document-processing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Environment :: Console"
]

[tool.poetry.urls]
"Homepage" = "https://github.com/anthonypdawson/ai-ebook-processor"
"Repository" = "https://github.com/anthonypdawson/ai-ebook-processor"
"Documentation" = "https://github.com/anthonypdawson/ai-ebook-processor#readme"
"Bug Reports" = "https://github.com/anthonypdawson/ai-ebook-processor/issues"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
ollama = "^0.5.0"
ebooklib = "^0.19"
PyMuPDF = "^1.26.0"
python-docx = "^1.2.0"
python-pptx = "^1.0.0"
chardet = "^5.2.0"
tqdm = "^4.67.0"
click = "^8.1.0"
pyyaml = "^6.0.0"
sentence-transformers = "^5.1.0"
numpy = "^2.1.0"
beautifulsoup4 = "^4.12.0"
requests = "^2.32.0"
pathvalidate = "^2.5.2"
portalocker = "^3.2.0"
pgvector = "^0.3.0"
prisma = "^0.15.0"
langchain = "^0.3.27"
pyreadline3 = "^3.5.4"
psycopg2-binary = "^2.9.10"
langchain-postgres = "^0.0.15"
langchain-community = "^0.3.30"
langchain-huggingface = "^0.3.1"
python-dotenv = "^1.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
black = "^22.0.0"
isort = "^5.10.0"
flake8 = "^5.0.0"

[tool.poetry.group.nlp.dependencies]
nltk = "^3.8"
redis = "^4.0.0"

[tool.poetry.scripts]
ebook-processor = "ai_ebook_processor.cli.commands:cli"
ebook-rag = "ai_ebook_processor.cli.commands:rag_cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["ai_ebook_processor/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"