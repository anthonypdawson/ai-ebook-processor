[project]
name = "ai-ebook-processor"
version = "1.0.0"
description = "AI-powered ebook processing and analysis tool with RAG capabilities"
authors = [{ name = "Anthony Dawson", email = "anthony@example.com" }]
requires-python = "~=3.9"
readme = "README.md"
license = "MIT"
keywords = [
    "ebook",
    "pdf",
    "epub",
    "ai",
    "ollama",
    "rag",
    "retrieval-augmented-generation",
    "nlp",
    "text-processing",
    "semantic-search",
    "vector-database",
    "chromadb",
    "book-analysis",
    "document-processing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Environment :: Console",
]
dependencies = [
    "ollama>=0.5.0,<0.6",
    "ebooklib>=0.19,<0.20",
    "PyMuPDF>=1.26.0,<2",
    "python-docx>=1.2.0,<2",
    "python-pptx>=1.0.0,<2",
    "chardet>=5.2.0,<6",
    "tqdm>=4.67.0,<5",
    "click>=8.1.0,<9",
    "pyyaml>=6.0.0,<7",
    "chromadb>=1.0.0,<2",
    "sentence-transformers>=5.1.0,<6",
    "numpy>=1.26.0,<2",
    "beautifulsoup4>=4.12.0,<5",
    "requests>=2.32.0,<3",
    "pathvalidate>=2.5.2,<3",
    "psutil>=7.1.0",
    "torch>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/anthonypdawson/ai-ebook-processor"
Repository = "https://github.com/anthonypdawson/ai-ebook-processor"
Documentation = "https://github.com/anthonypdawson/ai-ebook-processor#readme"
"Bug Reports" = "https://github.com/anthonypdawson/ai-ebook-processor/issues"

[project.scripts]
ebook-processor = "ai_ebook_processor.cli.commands:cli"
ebook-rag = "ai_ebook_processor.cli.commands:rag_cli"

[dependency-groups]
dev = [
    "pytest>=7.0.0,<8",
    "pytest-cov>=4.0.0,<5",
    "black>=22.0.0,<23",
    "isort>=5.10.0,<6",
    "flake8>=5.0.0,<6",
]
nlp = [
    "nltk~=3.8",
    "redis>=4.0.0,<5",
]

[tool.uv]
default-groups = [
    "dev",
    "nlp",
]

[tool.hatch.build.targets.sdist]
include = ["ai_ebook_processor"]

[tool.hatch.build.targets.wheel]
include = ["ai_ebook_processor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["ai_ebook_processor/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
