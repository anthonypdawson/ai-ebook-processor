ollama:
  host: http://localhost:11434
  model: llama3.2:latest
  temperature: 0.7
output:
  create_report: true
  directory: output
processing:
  chunk_overlap: 200
  chunk_size: 4000
  output_format: markdown
  processing_mode: summary
  save_chunks: false
  summary_mode: classic   # classic | strict (strict enforces grounded citations)
  summary_max_chars: 12000
  summary_temperature: 0.15
  require_citations: true
